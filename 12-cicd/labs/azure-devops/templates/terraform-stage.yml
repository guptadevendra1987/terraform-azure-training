# Reusable plan → (approval) → apply stage for one environment.
parameters:
  - name: environment
    type: string
  - name: serviceConnection
    type: string
  - name: dependsOn
    type: string
  - name: applyEnabled
    type: boolean
    default: false

stages:
  - stage: Deploy_${{ parameters.environment }}
    displayName: ${{ parameters.environment }}
    dependsOn: ${{ parameters.dependsOn }}
    jobs:
      - job: plan
        displayName: Plan ${{ parameters.environment }}
        steps:
          - script: |
              curl -sLo tf.zip https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip
              sudo unzip -o tf.zip -d /usr/local/bin
            displayName: Install Terraform

          # AzureCLI@2 with addSpnToEnvironment exposes the federated token so the azurerm provider can use OIDC
          - task: AzureCLI@2
            displayName: terraform plan
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(workingDir)
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_OIDC_TOKEN=$idToken
                export ARM_USE_OIDC=true
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform init -input=false -backend-config=env/${{ parameters.environment }}/backend.hcl
                terraform plan -input=false -var-file=env/${{ parameters.environment }}/terraform.tfvars -out=tfplan
                terraform show -no-color tfplan > plan.txt

          - publish: $(workingDir)/tfplan
            artifact: tfplan-${{ parameters.environment }}

      - ${{ if eq(parameters.applyEnabled, true) }}:
          - deployment: apply
            displayName: Apply ${{ parameters.environment }}
            dependsOn: plan
            environment: ${{ parameters.environment }} # approvals & checks are configured on the environment
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - download: current
                      artifact: tfplan-${{ parameters.environment }}
                    - script: |
                        curl -sLo tf.zip https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip
                        sudo unzip -o tf.zip -d /usr/local/bin
                      displayName: Install Terraform
                    - task: AzureCLI@2
                      displayName: terraform apply
                      inputs:
                        azureSubscription: ${{ parameters.serviceConnection }}
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        workingDirectory: $(workingDir)
                        inlineScript: |
                          export ARM_CLIENT_ID=$servicePrincipalId
                          export ARM_TENANT_ID=$tenantId
                          export ARM_OIDC_TOKEN=$idToken
                          export ARM_USE_OIDC=true
                          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                          terraform init -input=false -backend-config=env/${{ parameters.environment }}/backend.hcl
                          terraform apply -input=false $(Pipeline.Workspace)/tfplan-${{ parameters.environment }}/tfplan

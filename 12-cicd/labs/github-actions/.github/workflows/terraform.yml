# Terraform CI/CD with GitHub Actions + Azure OIDC (no client secret).
# PR:            fmt, validate, tflint, checkov, tests, plan for dev → plan posted as PR comment
# Push to main:  plan + apply dev → (approval) → plan + apply prod
name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  id-token: write        # required for OIDC
  contents: read
  pull-requests: write   # post the plan as a PR comment

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false   # never cancel a running apply

env:
  TF_VERSION: "1.17.2"
  WORKING_DIR: infra
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: tflint --init && tflint --recursive

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          quiet: true
          soft_fail: false

      - name: terraform test (mocked unit tests)
        run: terraform test -filter=tests/unit.tftest.hcl

  plan-dev:
    name: Plan (dev)
    needs: validate
    runs-on: ubuntu-latest
    # No environment here: the OIDC subject is "pull_request" on PRs and "ref:refs/heads/main" on push,
    # both of which have federated credentials (see oidc-bootstrap)
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend-config=env/dev/backend.hcl

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -var-file=env/dev/terraform.tfvars -out=dev.tfplan -detailed-exitcode -no-color
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ $code -eq 1 ] && exit 1
          terraform show -no-color dev.tfplan > plan.txt
          exit 0

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            const body = `### Terraform plan (dev)\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan.slice(0, 60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Upload plan artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dev-tfplan
          path: ${{ env.WORKING_DIR }}/dev.tfplan
          retention-days: 3   # plan files contain secrets: keep briefly

  apply-dev:
    name: Apply (dev)
    needs: plan-dev
    if: github.event_name != 'pull_request' && needs.plan-dev.outputs.exitcode == '2'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: dev-tfplan
          path: ${{ env.WORKING_DIR }}
      - run: terraform init -backend-config=env/dev/backend.hcl
      - run: terraform apply dev.tfplan   # applies exactly what was planned

  deploy-prod:
    name: Plan + Apply (prod)
    needs: [plan-dev, apply-dev]
    # Run even when apply-dev was skipped because dev had no changes, but never after a failure
    if: github.event_name != 'pull_request' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment: prod          # configure "Required reviewers" on this environment
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -backend-config=env/prod/backend.hcl
      - run: terraform plan -var-file=env/prod/terraform.tfvars -out=prod.tfplan
      - run: terraform apply prod.tfplan
